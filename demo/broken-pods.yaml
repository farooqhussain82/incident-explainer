# Four pods that fail in four common ways. Apply to a throwaway cluster:
#   kubectl apply -f demo/broken-pods.yaml
# Every image here is postgres:17-alpine, so the demo needs one image only.
---
# 1. CrashLoopBackOff: Postgres refuses to start without a superuser password.
apiVersion: v1
kind: Pod
metadata:
  name: orders-db
spec:
  containers:
    - name: postgres
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
---
# 2. OOMKilled: the process uses far more memory than its limit allows.
apiVersion: v1
kind: Pod
metadata:
  name: report-worker
spec:
  containers:
    - name: worker
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "echo 'building monthly report'; tail /dev/zero"]
      resources:
        limits:
          memory: 64Mi
---
# 3. CreateContainerConfigError: the pod needs a Secret that does not exist.
apiVersion: v1
kind: Pod
metadata:
  name: payments-api
spec:
  containers:
    - name: api
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: payments-secrets
              key: stripe-api-key
---
# 4. App crash with a secret in the log line, to show redaction.
apiVersion: v1
kind: Pod
metadata:
  name: checkout-web
spec:
  containers:
    - name: web
      image: postgres:17-alpine
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "starting checkout-web v2.4.1"
          echo "connecting to postgres://checkout:Sup3rS3cret@10.20.4.17:5432/checkout"
          echo "Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJjaGVja291dCJ9.c2lnbmF0dXJlLXZhbHVl"
          sleep 2
          echo "psql: error: connection to server at 10.20.4.17, port 5432 failed: Connection refused"
          echo "FATAL: could not connect to database after 3 attempts, exiting"
          exit 1
